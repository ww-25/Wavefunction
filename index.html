<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Electron Wavefunction Dynamics</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

  <video
    id="waveVideo"
    autoplay
    muted
    playsinline
    loop
    controls>

    <source
      src="https://journals.aps.org/prl/supplemental/10.1103/94bl-yb33/Wavefunction_10keV.mp4"
      type="video/mp4">

    Your browser does not support HTML5 video.
  </video>

  <script>
    const video = document.getElementById("waveVideo");

    video.muted = true;

    video.play().catch(() => {
      console.log("Autoplay was blocked by the browser.");
    });
  </script>

</body>
</html>
